model:
  name: ResearchLLM-300M
  vocab_size: 32000
  max_seq_len: 1024
  num_layers: 16
  hidden_size: 1024
  num_heads: 16
  ff_multiplier: 4

training:
  batch_size: 4
  grad_accum_steps: 8
  max_steps: 100000
  warmup_steps: 2000
  learning_rate: 2e-4
  weight_decay: 0.1
  grad_clip: 1.0
  checkpoint_interval: 10000
  eval_interval: 10000
