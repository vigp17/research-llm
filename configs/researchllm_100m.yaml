model:
  name: ResearchLLM-100M
  vocab_size: 32000
  max_seq_len: 1024
  num_layers: 8
  hidden_size: 768
  num_heads: 12
  ff_multiplier: 4

training:
  batch_size: 2
  grad_accum_steps: 16
  max_steps: 100000
  warmup_steps: 2000
  learning_rate: 3e-4
  weight_decay: 0.1
  grad_clip: 1.0
  checkpoint_interval: 10000
  eval_interval: 10000